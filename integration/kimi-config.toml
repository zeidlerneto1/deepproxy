# Kimi Code CLI config pointing at the local deepsproxy backend.
# Load with: kimi --config-file integration/kimi-config.toml --model deepsproxy/deepseek-v4-flash-thinking
default_model = "deepsproxy/deepseek-v4-flash-thinking"
default_thinking = false
default_yolo = false
theme = "dark"
show_thinking_stream = true
telemetry = false

[providers.deepsproxy]
type = "openai_legacy"
base_url = "http://localhost:3000/v1"
api_key = "dummy-key"

[models."deepsproxy/deepseek-v4-flash"]
provider = "deepsproxy"
model = "deepseek-v4-flash"
max_context_size = 131072

[models."deepsproxy/deepseek-v4-flash-thinking"]
provider = "deepsproxy"
model = "deepseek-v4-flash-thinking"
max_context_size = 131072
capabilities = ["thinking"]

[models."deepsproxy/deepseek-v4-pro"]
provider = "deepsproxy"
model = "deepseek-v4-pro"
max_context_size = 131072

[models."deepsproxy/deepseek-v4-pro-thinking"]
provider = "deepsproxy"
model = "deepseek-v4-pro-thinking"
max_context_size = 131072
capabilities = ["thinking"]

[loop_control]
max_steps_per_turn = 100
max_retries_per_step = 3
reserved_context_size = 50000
compaction_trigger_ratio = 0.85

[background]
max_running_tasks = 4
read_max_bytes = 30000
notification_tail_lines = 20
notification_tail_chars = 3000
wait_poll_interval_ms = 500
worker_heartbeat_interval_ms = 5000
worker_stale_after_ms = 15000
kill_grace_period_ms = 2000
keep_alive_on_exit = false
agent_task_timeout_s = 900
print_wait_ceiling_s = 3600

[notifications]
claim_stale_after_ms = 15000

[services]

[mcp.client]
tool_call_timeout_ms = 60000
